name: Build and Release Binary

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-proxy-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/cc-proxy
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: compile
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = "' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: cc-proxy-amd64
          path: binaries/cc-proxy-amd64

      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: cc-proxy-arm64
          path: binaries/cc-proxy-arm64

      - name: Rename binaries with arch suffix
        run: |
          # download-artifact v4 extracts each artifact into its own subdirectory
          mv binaries/cc-proxy-amd64/cc-proxy cc-proxy-amd64
          mv binaries/cc-proxy-arm64/cc-proxy cc-proxy-arm64
          chmod +x cc-proxy-amd64 cc-proxy-arm64
          ls -lh cc-proxy-*

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: cc-proxy v${{ steps.version.outputs.version }}
          body: |
            ## cc-proxy v${{ steps.version.outputs.version }}

            Pre-built binaries for Linux (statically linked, no glibc dependency).

            - `cc-proxy-amd64` — Linux x86_64
            - `cc-proxy-arm64` — Linux ARM64

            ### Usage
            ```bash
            # Download (example for amd64)
            curl -L https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/cc-proxy-amd64 -o cc-proxy
            chmod +x cc-proxy
            ./cc-proxy start -c /path/to/config/dir
            ```
          files: |
            cc-proxy-amd64
            cc-proxy-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}